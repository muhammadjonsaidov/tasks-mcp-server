<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCP Task Manager</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a; color: #e2e8f0;
            padding: 2rem; margin: 0;
        }
        h1 { color: #38bdf8; margin-bottom: 0.25rem; }
        .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .live-dot {
            display: inline-block; width: 8px; height: 8px;
            background: #22c55e; border-radius: 50%;
            margin-right: 6px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        table {
            width: 100%; border-collapse: collapse;
            background: #1e293b; border-radius: 8px; overflow: hidden;
        }
        th, td { padding: 12px 16px; text-align: left; }
        th { background: #334155; color: #cbd5e1; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:not(:last-child) td { border-bottom: 1px solid #334155; }
        code { color: #fbbf24; font-size: 0.85rem; }
        .status {
            display: inline-block; padding: 4px 10px;
            border-radius: 12px; font-size: 0.75rem; font-weight: bold;
        }
        .TODO         { background: #f59e0b; color: #0f172a; }
        .IN_PROGRESS  { background: #3b82f6; color: #ffffff; }
        .DONE         { background: #22c55e; color: #ffffff; }
        .empty { text-align: center; color: #64748b; padding: 2rem; }
        .flash { animation: flash 0.6s ease-out; }
        @keyframes flash { from { background: #334155; } to { background: transparent; } }
    </style>
</head>
<body>
<h1>📋 MCP Task Manager</h1>
<div class="subtitle"><span class="live-dot"></span>Live · updates from your Java MCP server</div>

<table>
    <thead>
    <tr><th>ID</th><th>Title</th><th>Status</th></tr>
    </thead>
    <tbody id="tasks-body">
    <tr><td colspan="3" class="empty">Waiting for tasks…</td></tr>
    </tbody>
</table>

<script>
    const tbody = document.getElementById('tasks-body');
    let prevIds = new Set();

    const evtSource = new EventSource('/api/tasks/stream');

    evtSource.addEventListener('tasks', (e) => {
        const tasks = JSON.parse(e.data);
        render(tasks);
    });

    evtSource.onerror = () => {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">⚠️ Connection lost. Retrying…</td></tr>';
    };

    function render(tasks) {
        if (!tasks || tasks.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty">No tasks yet. Ask Claude to create one!</td></tr>';
            prevIds.clear();
            return;
        }

        const currentIds = new Set(tasks.map(t => t.id));

        tbody.innerHTML = tasks.map(t => {
            const isNew = !prevIds.has(t.id);
            return `
                    <tr class="${isNew ? 'flash' : ''}">
                        <td><code>${t.id}</code></td>
                        <td>${escapeHtml(t.title)}</td>
                        <td><span class="status ${t.status}">${t.status}</span></td>
                    </tr>
                `;
        }).join('');

        prevIds = currentIds;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => (
            {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
        ));
    }
</script>
</body>
</html>
